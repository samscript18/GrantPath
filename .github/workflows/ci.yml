name: Local release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  correctness:
    name: Typecheck, lint, domain and PostgreSQL checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: grantpath
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: grantpath_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://grantpath:isolated-ci-only@localhost:5432/grantpath_test
      DIRECT_URL: postgresql://grantpath:isolated-ci-only@localhost:5432/grantpath_test
      TEST_DATABASE_URL: postgresql://grantpath:isolated-ci-only@localhost:5432/grantpath_test
      BETTER_AUTH_SECRET: ci-only-isolated-not-a-production-secret-2026
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      APP_ENV: test
      EMAIL_MODE: sink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:test-migrate
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: psql -h localhost -U grantpath -d grantpath_test -c 'CREATE DATABASE grantpath_e2e_test'
        env:
          PGPASSWORD: isolated-ci-only
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://grantpath:isolated-ci-only@localhost:5432/grantpath_e2e_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
